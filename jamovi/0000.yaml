---
title: Multivariate Exploratory Data Analysis
name: MEDA
version: 1.6.0
jms: '1.0'
authors:
  - Thomas Leblay
  - Fiona Tuffin
  - Maxime Saland
  - Maïwen Faure
  - Sébastien Lê
maintainer: Sébastien Lê <sebastien.le@agrocampus-ouest.fr>
date: '2023-07-26'
type: R
description: >-
  This module allows you to perform multivariate exploratory analyses using the
  FactoMineR framework. You can add supplementary information to improve the
  interpretation of your results. Four main methods are implemented: Principal
  Component Analysis, Correspondence Analysis, Multiple Correspondence Analysis,
  and Multiple Factor Analysis. Unsupervised clustering can also be performed on
  the retained components. The module also provides automatic description of a
  variable based on the other variables in the dataset (categorical or
  quantitative). Results are obtained using the FactoMineR package. These
  analyses are described on the <a
  href="https://sebastien-le.github.io/medasite/index.html" target="_blank">MEDA
  website</a>.
analyses:
  - title: Variable Described by Categorical / Quantitative Data
    name: catdes
    ns: MEDA
    menuGroup: MEDA
    menuTitle: By Categorical / Quantitative Data
    menuSubgroup: Automatic Univariate Description
    menuSubtitle: FactoMineR::catdes/condes
