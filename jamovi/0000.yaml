  - Thomas Leblay
  - Fiona Tuffin
  - Maxime Saland
  - Maïwen Faure
  - Sébastien Lê
maintainer: Sébastien Lê <sebastien.le@agrocampus-ouest.fr>
date: '2026-08-15'
type: R
description: >-
  MEDA provides exploratory multivariate data analyses through the FactoMineR
  framework. It implements Principal Component Analysis, Correspondence
  Analysis, Multiple Correspondence Analysis, and Multiple Factor Analysis, with
  supplementary information where applicable. Analyses can include automatic
  dimension descriptions and unsupervised clustering based on the retained
  components. The module also describes variables and contingency tables using
  categorical, quantitative, or textual data. Each analysis can display concise
  R code for use in the jamovi Rj Editor. Further documentation is available on
  the <a href="https://sebastien-le.github.io/medasite/index.html"
  target="_blank">MEDA website</a>.
analyses:
