---
name: CA
title: Results of the Correspondence Analysis
jrs: '1.1'
refs: 
    - factominer
    - explo

items:
  - name: caCache
    title: CA cache
    type: Preformatted
    visible: false
    clearWith: [activecol, illustrativecol, indiv, ncp, nbfact, abs, ord]

  - name: classifCache
    title: Classification cache
    type: Preformatted
    visible: false
    clearWith: [activecol, illustrativecol, indiv, ncp, nbclust]

  - name: instructions
    title: Instructions
    visible: (tuto)
    type: Html
    
  - name: plotirow
    title: Representation of the Rows
    type: Image
    width: 600
    height: 500
    renderFun: .plotrow
    clearWith: [activecol, illustrativecol, indiv, ncp, nbfact, abs, ord, limcoscol, limcosrow]

  - name: ploticol
    title: Representation of the Columns
    type: Image
    width: 600
    height: 500
    renderFun: .plotcol
    clearWith: [activecol, illustrativecol, indiv, ncp, nbfact, abs, ord, limcoscol, limcosrow, addillucol]

  - name: plotell
    title: Superimposed Representation with Ellipses
    type: Image
    width: 600
    height: 500
    renderFun: .plotell
    clearWith: [activecol, illustrativecol, indiv, ncp, nbfact, abs, ord, limcoscol, limcosrow, ellipsecol, ellipserow, addillucol]

  - name: xsqgroup
    title: Chi-Squared Test
    type: Group
    items:
      - name: xsq
        title: Pearson's Chi-Squared Test
        type: Table
        rows: 1
        columns:
          - name: xsquared
            title: X-squared
            type: number
          - name: df
            title: df
            type: integer
          - name: pvxsq
            title: p
            type: number
            format: zto,pvalue

  - name: eigengroup
    title: Eigenvalue Decomposition
    type: Group
    items:
      - name: eigen
        title: 'Eigenvalue and (Cumulative) Percentage of Variance'
        type: Table
        columns:
          - name: component
            title: ''
            type: 'text'
          - name: eigenvalue
            title: 'Eigenvalue'
            type: number
          - name: purcent
            title: '% of the variance'
            type: number
          - name: purcentcum
            title: 'Cumulative %'
            type: number

  - name: descofdimgroup
    title: Automatic Description of the Dimensions
    type: Group
    items:
      - name: descofdim
        title: ''
        type: Table
        columns:
          - name: dim
            title: ''
            type: text
            combineBelow: true
          - name: rowcol
            title: ''
            type: text
            combineBelow: true
          - name: cat
            title: Category
            type: text
          - name: coord
            title: Coordinate
            type: number

  - name: rowgroup
    title: Row Tables
    type: Group
    items:
      - name: coordonnees
        title: Coordinates Table
        visible: (coordrow)
        type: Table
        clearWith:
          - nbfact
        columns: []

      - name: contribution
        title: Contributions Table
        visible: (contribrow)
        type: Table
        clearWith:
          - nbfact
        columns: []

      - name: cosinus
        title: Cosine Table
        visible: (cosrow)
        type: Table
        clearWith:
          - nbfact
        columns: []

  - name: colgroup
    title: Column Tables
    type: Group
    items:
      - name: coordonnees
        title: Coordinates Table
        visible: (coordcol)
        type: Table
        clearWith:
          - nbfact
        columns: []

      - name: contribution
        title: Contributions Table
        visible: (contribcol)
        type: Table
        clearWith:
          - nbfact
        columns: []

      - name: cosinus
        title: Cosine Table
        visible: (coscol)
        type: Table
        clearWith:
          - nbfact
        columns: []

  - name: plotclassif
    title: Representation of the Rows According to Clusters
    visible: (graphclassif)
    type: Image
    width: 600
    height: 500
    renderFun: .plotclassif
    clearWith: [activecol, illustrativecol, indiv, ncp, nbclust, abs, ord, graphclassif]

  - name: newvar
    type: Output
    title: Coordinates
    measureType: continuous
    initInRun: true
    clearWith:
      - activecol
      - illustrativecol
      - indiv
      - nbfact
      - ncp

  - name: newvar2
    type: Output
    title: Cluster
    measureType: nominal
    initInRun: true
    clearWith:
      - activecol
      - illustrativecol
      - indiv
      - nbfact
      - nbclust
      - ncp

  - name: code
    title: R code
    type: Preformatted
    visible: (showCode)
    clearWith:
      - showCode
      - activecol
      - illustrativecol
      - indiv
      - nbfact
      - proba
      - abs
      - ord
      - limcoscol
      - limcosrow
      - ellipsecol
      - ellipserow
      - addillucol
      - coordcol
      - contribcol
      - coscol
      - coordrow
      - contribrow
      - cosrow
      - ncp
      - graphclassif
      - nbclust
      - newvar
      - newvar2
