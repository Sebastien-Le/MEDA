title: Variable Described by Categorical / Quantitative Data
name: catdes
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variable to Characterize
        children:
          - type: VariablesListBox
            name: vartochar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Described by
        children:
          - type: VariablesListBox
            name: descbyvar
            isTarget: true
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: Label
        label: Instructions and R Code
        stretchFactor: 1
        children:
          - type: Label
            label: ''
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: tuto
          - type: Label
            label: ''
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: showCode
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: threshold
        format: number
