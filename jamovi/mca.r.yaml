---
name: MCA
title: Results of the Multiple Correspondence Analysis
jrs: '1.1'
refs: 
    - factominer
    - explo

items:
  - name: mcaCache
    title: MCA cache
    type: Preformatted
    visible: false
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - ventil

  - name: classifCache
    title: Classification cache
    type: Preformatted
    visible: false
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - ventil
      - ncp
      - nbclust

  - name: dimdescCache
    title: Dimension description cache
    type: Preformatted
    visible: false
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - ventil
      - nFactors
      - proba

  - name: instructions
    title: Instructions
    visible: (tuto)
    type: Html

  - name: plotindiv
    title: Representation of the Individuals
    type: Image
    width: 700
    height: 500
    renderFun: .plotindiv
    clearWith:
      - data
      - actvars
      - individus
      - ventil
      - ncp
      - nFactors
      - abs
      - ord

  - name: plotvar
    title: Representation of the Variables
    type: Image
    width: 700
    height: 500
    renderFun: .plotvar
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - ventil
      - ncp
      - nFactors
      - abs
      - ord

  - name: plotitemvar
    title: Representation of the Categories
    type: Image
    width: 700
    height: 500
    renderFun: .plotitemvar
    clearWith:
      - data
      - actvars
      - qualisup
      - ventil
      - ncp
      - nFactors
      - abs
      - ord
      - varmodqualisup
      - varmodvar
      - modality

  - name: plotquantisup
    title: Representation of the Supplementary Variables
    type: Image
    visible: (quantimod)
    width: 700
    height: 500
    renderFun: .plotquantisup
    clearWith:
      - data
      - actvars
      - quantisup
      - ventil
      - ncp
      - nFactors
      - abs
      - ord
      - quantimod

  - name: eigengroup
    title: Eigenvalue Decomposition
    type: Group
    items:
      - name: eigen
        title: 'Eigenvalue and (Cumulative) Percentage of Variance'
        type: Table
        clearWith:
          - actvars
          - ventil
          - ncp
        columns:
          - name: component
            title: ''
            type: 'text'
          - name: eigenvalue
            title: 'Eigenvalue'
            type: number
          - name: purcent
            title: '% of the variance'
            type: number
          - name: purcentcum
            title: 'Cumulative %'
            type: number

  - name: dimdesc
    title: Automatic Description of the Dimensions
    type: Group
    items:
      - name: continuous
        title: Continuous Variables
        type: Table
        columns:
          - name: dimension
            title: Dimension
            type: text
            combineBelow: true
          - name: variable
            title: Variable
            type: text
          - name: correlation
            title: Correlation
            type: number
            format: zto
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: n
            title: N
            type: integer

      - name: categorical
        title: Categorical Variables
        type: Table
        columns:
          - name: dimension
            title: Dimension
            type: text
            combineBelow: true
          - name: variable
            title: Variable
            type: text
          - name: r2
            title: R²
            type: number
            format: zto
          - name: p
            title: p
            type: number
            format: zto,pvalue

      - name: categories
        title: Categories
        type: Table
        columns:
          - name: dimension
            title: Dimension
            type: text
            combineBelow: true
          - name: category
            title: Category
            type: text
          - name: estimate
            title: Estimate
            type: number
            format: zto
          - name: p
            title: p
            type: number
            format: zto,pvalue

  - name: individus
    title: Individual Tables
    type: Group
    items:
      - name: coordonnees
        title: Coordinates Table
        type: Table
        visible: (indcoord)
        clearWith:
          - actvars
          - individus
          - ventil
          - ncp
          - nFactors
        columns: []

      - name: contribution
        title: Contributions Table
        type: Table
        visible: (indcontrib)
        clearWith:
          - actvars
          - individus
          - ventil
          - ncp
          - nFactors
        columns: []

      - name: cosinus
        title: Cosine Table
        type: Table
        visible: (indcos)
        clearWith:
          - actvars
          - individus
          - ventil
          - ncp
          - nFactors
        columns: []

  - name: variables
    title: Variable Tables
    type: Group
    items:
      - name: coordonnees
        title: Coordinates Table
        type: Table
        visible: (varcoord)
        clearWith:
          - actvars
          - ventil
          - ncp
          - nFactors
        columns: []

      - name: contribution
        title: Contributions Table
        type: Table
        visible: (varcontrib)
        clearWith:
          - actvars
          - ventil
          - ncp
          - nFactors
        columns: []

      - name: cosinus
        title: Cosine Table
        type: Table
        visible: (varcos)
        clearWith:
          - actvars
          - ventil
          - ncp
          - nFactors
        columns: []

  - name: plotclassif
    title: Representation of the Rows According to Clusters
    visible: (graphclassif)
    type: Image
    width: 700
    height: 500
    renderFun: .plotclassif
    clearWith:
      - data
      - actvars
      - individus
      - ventil
      - ncp
      - nFactors
      - nbclust
      - abs
      - ord

  - name: newvar
    type: Output
    title: Coordinates
    measureType: continuous
    initInRun: true
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - nFactors
      - ventil
      - ncp
      - abs
      - ord

  - name: newvar2
    type: Output
    title: Cluster
    measureType: nominal
    initInRun: true
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - nFactors
      - ventil
      - nbclust
      - ncp
      - abs
      - ord

  - name: code
    title: R code
    type: Preformatted
    visible: (showCode)
    clearWith:
      - showCode
      - actvars
      - quantisup
      - qualisup
      - individus
      - ventil
      - ncp
      - nFactors
      - proba
      - abs
      - ord
      - varmodqualisup
      - varmodvar
      - modality
      - quantimod
      - indcoord
      - indcontrib
      - indcos
      - varcoord
      - varcontrib
      - varcos
      - graphclassif
      - nbclust
      - newvar
      - newvar2
