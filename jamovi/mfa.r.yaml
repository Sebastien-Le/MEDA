---
name: MFA
title: Results of the Multiple Factor Analysis
jrs: '1.1'
refs:
  - factominer
  - mfa
  - explo

items:
  - name: mfaCache
    title: MFA cache
    type: Preformatted
    visible: false
    clearWith:
      - data
      - quantivar
      - qualivar
      - individus
      - groupdef
      - grouptype
      - groupill
      - groupname

  - name: classifCache
    title: Classification cache
    type: Preformatted
    visible: false
    clearWith:
      - data
      - quantivar
      - qualivar
      - individus
      - groupdef
      - grouptype
      - groupill
      - groupname
      - ncp
      - nbclust

  - name: instructions
    title: Instructions
    visible: (tuto)
    type: Html

  - name: plotgroup
    title: Representation of the Groups
    type: Image
    width: 600
    height: 600
    renderFun: .plotgroups
    clearWith:
      - data
      - quantivar
      - qualivar
      - groupdef
      - grouptype
      - groupill
      - groupname
      - ncp
      - nFactors
      - abs
      - ord

  - name: plotaxe
    title: Representation of the Partial Axes
    type: Image
    width: 600
    height: 600
    renderFun: .plotaxes
    clearWith:
      - data
      - quantivar
      - qualivar
      - groupdef
      - grouptype
      - groupill
      - groupname
      - ncp
      - nFactors
      - abs
      - ord

  - name: plotind
    title: Representation of the Individuals
    type: Image
    width: 800
    height: 600
    renderFun: .plotindividus
    clearWith:
      - data
      - quantivar
      - qualivar
      - individus
      - groupdef
      - grouptype
      - groupill
      - groupname
      - ncp
      - nFactors
      - abs
      - ord

  - name: plotcat
    title: Representation of the Categories
    type: Image
    visible: false
    width: 800
    height: 600
    renderFun: .plotcategory
    clearWith:
      - data
      - quantivar
      - qualivar
      - groupdef
      - grouptype
      - groupill
      - groupname
      - ncp
      - nFactors
      - abs
      - ord
      - modality

  - name: plotvar
    title: Representation of the Variables
    type: Image
    visible: false
    width: 700
    height: 700
    renderFun: .plotvariables
    clearWith:
      - data
      - quantivar
      - qualivar
      - groupdef
      - grouptype
      - groupill
      - groupname
      - ncp
      - nFactors
      - abs
      - ord

  - name: eigengroup
    title: Eigenvalue Decomposition
    type: Group
    items:
      - name: eigen
        title: Eigenvalue and (Cumulative) Percentage of Variance
        type: Table
        clearWith:
          - data
          - quantivar
          - qualivar
          - groupdef
          - grouptype
          - groupill
          - ncp
        columns:
          - name: component
            title: ''
            type: text
          - name: eigenvalue
            title: Eigenvalue
            type: number
          - name: purcent
            title: '% of the variance'
            type: number
          - name: purcentcum
            title: Cumulative %
            type: number

  - name: dimdesc
    title: Automatic Description of the Dimensions
    type: Group
    clearWith:
      - data
      - quantivar
      - qualivar
      - groupdef
      - grouptype
      - groupill
      - ncp
      - nFactors
      - proba
    items:
      - name: continuous
        title: Continuous Variables
        type: Table
        columns:
          - { name: dimension, title: Dimension, type: text, combineBelow: true }
          - { name: variable, title: Variable, type: text }
          - { name: correlation, title: Correlation, type: number, format: zto }
          - { name: p, title: p, type: number, format: 'zto,pvalue' }
          - { name: n, title: N, type: integer }
      - name: categorical
        title: Categorical Variables
        type: Table
        columns:
          - { name: dimension, title: Dimension, type: text, combineBelow: true }
          - { name: variable, title: Variable, type: text }
          - { name: r2, title: R², type: number, format: zto }
          - { name: p, title: p, type: number, format: 'zto,pvalue' }
      - name: categories
        title: Categories
        type: Table
        columns:
          - { name: dimension, title: Dimension, type: text, combineBelow: true }
          - { name: category, title: Category, type: text }
          - { name: estimate, title: Estimate, type: number, format: zto }
          - { name: p, title: p, type: number, format: 'zto,pvalue' }

  - name: plotclassif
    title: Representation of the Individuals According to Clusters
    visible: (graphclassif)
    type: Image
    width: 800
    height: 600
    renderFun: .plotclassif
    clearWith:
      - data
      - quantivar
      - qualivar
      - individus
      - groupdef
      - grouptype
      - groupill
      - ncp
      - nFactors
      - nbclust
      - abs
      - ord

  - name: newvar
    type: Output
    title: Coordinates
    measureType: continuous
    initInRun: true
    clearWith:
      - data
      - quantivar
      - qualivar
      - individus
      - groupdef
      - grouptype
      - groupill
      - ncp

  - name: newvar2
    type: Output
    title: Cluster
    measureType: nominal
    initInRun: true
    clearWith:
      - data
      - quantivar
      - qualivar
      - individus
      - groupdef
      - grouptype
      - groupill
      - ncp
      - nbclust

  - name: code
    title: R code
    type: Preformatted
    visible: (showCode)
    clearWith:
      - showCode
      - quantivar
      - qualivar
      - individus
      - groupdef
      - grouptype
      - groupill
      - groupname
      - ncp
      - nFactors
      - proba
      - abs
      - ord
      - modality
      - graphclassif
      - nbclust
      - newvar2
