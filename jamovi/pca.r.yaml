---
name: PCA
title: Results of the Principal Component Analysis
jrs: '1.1'
refs: 
    - factominer
    - explo

items:
  - name: pcaCache
    title: PCA cache
    type: Preformatted
    visible: false
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - norme

  - name: classifCache
    title: Classification cache
    type: Preformatted
    visible: false
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - norme
      - ncp
      - nbclust

  - name: instructions
    title: Instructions
    visible: (tuto)
    type: Html
  
  - name: plotind
    title: Representation of the Individuals (and the Categories)
    type: Image
    width: 800
    height: 600
    renderFun: .plotindividus
    clearWith: [data, actvars, quantisup, qualisup, individus, norme, ncp, nFactors, abs, ord]

  - name: plotvar
    title: Representation of the Variables
    type: Image
    width: 600
    height: 600
    renderFun: .plotvariables
    clearWith: [data, actvars, quantisup, individus, norme, ncp, nFactors, abs, ord]
    
  - name: plotseulind
    title: Representation of the Individuals Only
    visible: (graphind)
    type: Image
    width: 800
    height: 600
    renderFun: .plotseulind
    clearWith: [data, actvars, qualisup, individus, norme, ncp, nFactors, abs, ord, graphind]

  - name: plotseulmod
    title: Representation of the Categories Only
    visible: (graphmod)
    type: Image
    width: 800
    height: 600
    renderFun: .plotseulmod
    clearWith: [data, actvars, qualisup, individus, norme, ncp, nFactors, abs, ord, graphmod]
    
  - name: plothabillage
    title: Representation of the Individuals Colored by Variable
    visible: (habillage > 0)
    type: Image
    width: 800
    height: 600
    renderFun: .plothabillage  
    clearWith: [data, actvars, qualisup, quantisup, individus, norme, ncp, nFactors, abs, ord, habillage]

  - name: plotseulvaract
    title: Representation of the Active Variables Only
    visible: (graphvaract)
    type: Image
    width: 600
    height: 600
    renderFun: .plotseulvaract
    clearWith: [data, actvars, quantisup, individus, norme, ncp, nFactors, abs, ord, graphvaract]

  - name: plotseulvarillu
    title: Representation of the Supplementary Variables Only
    visible: (graphvarillu)
    type: Image
    width: 600
    height: 600
    renderFun: .plotseulvarillu
    clearWith: [data, actvars, quantisup, individus, norme, ncp, nFactors, abs, ord, graphvarillu]

  - name: eigengroup
    title: Eigenvalue Decomposition
    type: Group
    items:
      - name: eigen
        title: 'Eigenvalue and (Cumulative) Percentage of Variance'
        type: Table
        columns:
          - name: component
            title: ''
            type: 'text'
          - name: eigenvalue
            title: 'Eigenvalue'
            type: number
          - name: purcent
            title: '% of the variance'
            type: number
          - name: purcentcum
            title: 'Cumulative %'
            type: number

  - name: dimdesc
    title: Automatic Description of the Dimensions
    type: Group
    items:
      - name: continuous
        title: Continuous Variables
        type: Table
        columns:
          - { name: dimension, title: Dimension, type: text, combineBelow: true }
          - { name: variable, title: Variable, type: text }
          - { name: correlation, title: Correlation, type: number, format: zto }
          - { name: p, title: p, type: number, format: 'zto,pvalue' }
          - { name: n, title: N, type: integer }
      - name: categorical
        title: Categorical Variables
        type: Table
        columns:
          - { name: dimension, title: Dimension, type: text, combineBelow: true }
          - { name: variable, title: Variable, type: text }
          - { name: r2, title: R², type: number, format: zto }
          - { name: p, title: p, type: number, format: 'zto,pvalue' }
      - name: categories
        title: Categories
        type: Table
        columns:
          - { name: dimension, title: Dimension, type: text, combineBelow: true }
          - { name: category, title: Category, type: text }
          - { name: estimate, title: Estimate, type: number, format: zto }
          - { name: p, title: p, type: number, format: 'zto,pvalue' }

  - name: individus
    title: Individual Tables
    type: Group
    items:
      - name: coordonnees
        title: Coordinates Table
        visible: (coordind)
        type: Table
        clearWith:
          - nFactors
        columns: []

      - name: contribution
        title: Contributions Table
        visible: (contribind)
        type: Table
        clearWith:
          - nFactors
        columns: []

      - name: cosinus
        title: Cosine Table
        visible: (cosind)
        type: Table
        clearWith:
          - nFactors
        columns: []

  - name: variables
    title: Variable Tables
    type: Group
    items:
      - name: coordonnees
        title: Coordinates Table
        visible: (coordvar)
        type: Table
        clearWith:
          - nFactors
        columns: []

      - name: contribution
        title: Contributions Table
        visible: (contribvar)
        type: Table
        clearWith:
          - nFactors
        columns: []

      - name: cosinus
        title: Cosine Table
        visible: (cosvar)
        type: Table
        clearWith:
          - nFactors
        columns: []
  
  - name: plotclassif
    title: Representation of the Individuals According to Clusters
    visible: (graphclassif)
    type: Image
    width: 800
    height: 600
    renderFun: .plotclassif
    clearWith: [data, actvars, quantisup, qualisup, individus, norme, ncp, nbclust, abs, ord, graphclassif]

  - name: newvar
    type: Output
    title: Coordinates
    measureType: continuous
    initInRun: true
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - nFactors
      - norme
      - ncp

  - name: newvar2
    type: Output
    title: Cluster
    measureType: nominal
    initInRun: true
    clearWith:
      - data
      - actvars
      - quantisup
      - qualisup
      - individus
      - nFactors
      - norme
      - nbclust
      - ncp

  - name: code
    title: R code
    type: Preformatted
    visible: (showCode)
    clearWith:
      - showCode
      - actvars
      - quantisup
      - qualisup
      - individus
      - norme
      - coordvar
      - contribvar
      - cosvar
      - coordind
      - contribind
      - cosind
      - proba
      - nFactors
      - abs
      - ord
      - graphvaract
      - graphvarillu
      - graphind
      - graphmod
      - habillage
      - ncp
      - newvar
      - graphclassif
      - nbclust
      - newvar2    
